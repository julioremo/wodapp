<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | CrossFit Tracker</title>
    <style>
    body {
      font-family:
        ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background-color: #09090b; /* shadcn dark mode background */
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1rem;
      color: #a1a1aa; /* muted foreground */
      max-width: 24rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    button {
      background-color: #fafafa;
      color: #18181b;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #e4e4e7;
    }
    svg {
      width: 48px;
      height: 48px;
      margin-bottom: 1.5rem;
      color: #52525b;
    }
    </style>
  </head>
  <body>
    <!-- Lucide Wi-Fi Off Icon -->
    <svg
      role="figure"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <line x1="2" x2="22" y1="2" y2="22" />
      <path d="M8.5 16.5L12 20l3.5-3.5" />
      <path d="M4.93 12.93a10 10 0 0 1 11.2-.53" />
      <path d="M2.9 9.9a14 14 0 0 1 14.54-1.22" />
    </svg>

    <h1>You're Offline</h1>
    <p>
      We couldn't load this page. It seems you’re offline. Check your connection to sync your latest
      classes and benchmarks.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </body>
</html>
